<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PADIPUCAST &#183; Wave Optics &#183; Lecture DPP + Key Ideas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'LemonMilk';src:url('https://cdn.jsdelivr.net/gh/nicholasgasior/lemon-milk@main/lemon_milk.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'LemonMilk';src:url('https://cdn.jsdelivr.net/gh/nicholasgasior/lemon-milk@main/lemon_milk_bold.woff2') format('woff2');font-weight:700;font-display:swap;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#ffffff;--border:#e8e6e0;--border2:#d4d1c8;
  --text:#1a1916;--text2:#6b6760;--text3:#a09d97;--accent:#1a1916;
  --tag-bg:#f0ede8;--correct-bg:#f0faf5;--correct:#1a7a4a;--correct-border:#b3e0c6;
  --wrong-bg:#fff5f5;--wrong:#c0392b;--wrong-border:#f5c6c2;
  --yt:#ff2d2d;--pill-active-bg:#1a1916;--pill-active-text:#f7f6f3;
}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;}
#shell{max-width:760px;margin:0 auto;padding:0 24px 80px;}
#topnav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 32px;}
.brand{font-family:'LemonMilk',sans-serif;font-size:11px;letter-spacing:0.18em;color:var(--text);text-transform:uppercase;}
.brand span{color:var(--text3);}
#back-btn{display:none;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.12em;color:var(--text2);text-transform:uppercase;padding:6px 0;transition:color 0.15s;}
#back-btn:hover{color:var(--text);}
#back-btn svg{transition:transform 0.15s;}
#back-btn:hover svg{transform:translateX(-2px);}
.screen{display:none;}
.screen.active{display:block;}
#home-heading{margin-bottom:8px;}
#home-heading h1{font-family:'LemonMilk',sans-serif;font-size:22px;font-weight:700;letter-spacing:0.04em;line-height:1.3;}
#home-sub{font-size:14px;color:var(--text2);margin-bottom:20px;}
.home-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px;flex-wrap:wrap;}
.progress-summary{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);}
.progress-summary span{color:var(--correct);font-weight:700;}
#clear-all-btn{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--wrong-border);border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--wrong);transition:all 0.15s;display:flex;align-items:center;gap:6px;}
#clear-all-btn:hover{background:var(--wrong-bg);border-color:var(--wrong);}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.topic-grid{grid-template-columns:1fr;}}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;cursor:pointer;transition:border-color 0.18s,box-shadow 0.18s,transform 0.18s;text-align:left;position:relative;overflow:hidden;}
.topic-card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,0.07);transform:translateY(-2px);}
.topic-card:active{transform:translateY(0);}
.tc-num{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--text3);margin-bottom:8px;text-transform:uppercase;}
.tc-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:10px;padding-right:20px;}
.tc-bar{display:flex;align-items:center;gap:8px;}
.tc-dots{display:flex;gap:3px;}
.tc-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);}
.tc-dot.done{background:var(--correct);}
.tc-dot.wrong{background:var(--wrong);}
.tc-count{font-size:12px;color:var(--text3);}
.tc-arrow{position:absolute;right:18px;top:22px;color:var(--text3);transition:transform 0.18s,color 0.18s;}
.topic-card:hover .tc-arrow{transform:translateX(3px);color:var(--text);}
.topic-card.all-done{border-color:var(--correct-border);}
.topic-card.all-done .tc-arrow{color:var(--correct);}
#qscreen-header{margin-bottom:28px;}
.qs-topic{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.18em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;}
.qs-title{font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.q-selector{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
.q-pill{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.05em;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.q-pill:hover{border-color:var(--border2);color:var(--text);}
.q-pill.active{background:var(--pill-active-bg);color:var(--pill-active-text);border-color:var(--pill-active-bg);}
.q-pill.answered-c{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct);}
.q-pill.answered-w{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong);}
#q-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 28px 24px;position:relative;}
.q-label{font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:0.2em;color:var(--text3);text-transform:uppercase;margin-bottom:14px;}
.q-label .orig{color:#b45309;}
.q-text{font-size:15.5px;line-height:1.75;color:var(--text);margin-bottom:16px;font-weight:400;}
.q-text sup{font-size:0.75em;}
.q-text sub{font-size:0.75em;}
.q-diagram{margin-bottom:20px;display:flex;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;}
.q-diagram svg{max-width:100%;height:auto;}
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer;font-size:14px;color:var(--text2);transition:all 0.15s;text-align:left;}
.opt sup{font-size:0.75em;}.opt sub{font-size:0.75em;}
.opt:hover:not(.locked){border-color:var(--border2);color:var(--text);background:var(--surface);}
.opt-letter{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:0.05em;color:var(--text3);flex-shrink:0;transition:all 0.15s;background:var(--surface);}
.opt:hover:not(.locked) .opt-letter{border-color:var(--text);color:var(--text);}
.opt.is-correct{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct);}
.opt.is-correct .opt-letter{background:var(--correct-bg);border-color:var(--correct-border);color:var(--correct);}
.opt.is-wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong);}
.opt.is-wrong .opt-letter{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong);}
.opt.reveal-correct{opacity:0.5;}
.opt.locked{cursor:default;pointer-events:none;}
#sol-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.4s ease,opacity 0.35s ease;}
#sol-wrap.open{max-height:700px;opacity:1;}
#sol-box{border-left:2px solid var(--text3);padding:12px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.75;color:var(--text2);}
#sol-box strong{color:var(--text);font-weight:600;}
#sol-box sup{font-size:0.75em;}#sol-box sub{font-size:0.75em;}
.act-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
#show-ans-btn{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--border);border-radius:8px;padding:9px 16px;cursor:pointer;color:var(--text2);transition:all 0.15s;}
#show-ans-btn:hover{border-color:var(--border2);color:var(--text);}
.nav-btns{display:flex;gap:8px;}
#prev-btn,#next-btn{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border-radius:8px;padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;border:1px solid var(--border);}
#prev-btn{background:none;color:var(--text2);}
#prev-btn:hover{border-color:var(--border2);color:var(--text);}
#next-btn{background:var(--text);color:var(--bg);border-color:var(--text);}
#next-btn:hover{opacity:0.85;}
#next-btn:disabled,#prev-btn:disabled{opacity:0.3;cursor:default;pointer-events:none;}
#feedback{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 12px;border-radius:20px;opacity:0;transform:scale(0.85);transition:all 0.25s cubic-bezier(.34,1.56,.64,1);}
#feedback.show{opacity:1;transform:scale(1);}
#feedback.fb-c{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct-border);}
#feedback.fb-w{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong-border);}
#yt-corner{position:fixed;bottom:28px;right:28px;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.1);overflow:hidden;z-index:200;display:none;animation:popUp 0.28s cubic-bezier(.34,1.56,.64,1);}
@keyframes popUp{from{opacity:0;transform:translateY(12px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
#yt-corner.visible{display:block;}
.yt-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.yt-label{font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:6px;}
.yt-label svg{color:var(--yt);}
#yt-close{background:none;border:none;cursor:pointer;color:var(--text3);line-height:1;padding:2px;transition:color 0.15s;}
#yt-close:hover{color:var(--text);}
.yt-body{padding:14px;}
.yt-hint{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5;}
.yt-input-row{display:flex;gap:6px;}
#yt-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12.5px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.15s;}
#yt-input:focus{border-color:var(--border2);}
#yt-go{background:var(--yt);color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;transition:opacity 0.15s;white-space:nowrap;}
#yt-go:hover{opacity:0.85;}
#yt-embed{margin-top:12px;border-radius:8px;overflow:hidden;display:none;}
#yt-embed iframe{width:100%;height:158px;border:none;display:block;}
#yt-trigger{position:fixed;bottom:28px;right:28px;width:44px;height:44px;border-radius:50%;background:var(--yt);color:#fff;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,45,45,0.35);transition:transform 0.2s,box-shadow 0.2s;z-index:199;}
#yt-trigger.visible{display:flex;}
#yt-trigger:hover{transform:scale(1.08);box-shadow:0 6px 22px rgba(255,45,45,0.45);}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen.active{animation:fadeSlideIn 0.3s ease forwards;}
#q-card{animation:fadeSlideIn 0.25s ease forwards;}
.score-strip{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.score-chip{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;border:1px solid var(--border);color:var(--text2);}
.score-chip span{color:var(--text);font-weight:700;}
#clear-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center;}
#clear-modal.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 28px 24px;max-width:360px;width:90%;animation:popUp 0.25s cubic-bezier(.34,1.56,.64,1);}
.modal-title{font-family:'LemonMilk',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;margin-bottom:10px;}
.modal-body{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:24px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.modal-cancel{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid var(--border);border-radius:8px;padding:9px 18px;cursor:pointer;color:var(--text2);transition:all 0.15s;}
.modal-cancel:hover{border-color:var(--border2);color:var(--text);}
.modal-confirm{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:var(--wrong);color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;transition:opacity 0.15s;}
.modal-confirm:hover{opacity:0.85;}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 20px;border-radius:999px;opacity:0;transition:opacity 0.3s,transform 0.3s;z-index:600;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.srctag{display:inline-block;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;background:var(--tag-bg);color:var(--text2);border:1px solid var(--border2);border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:middle;}
.modepill{display:inline-block;font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;border-radius:5px;padding:3px 8px;margin-bottom:6px;}
.mp-class{background:#1a1916;color:#f7f6f3;}
.mp-hw{background:#f0ede8;color:#6b6760;border:1px solid #d4d1c8;}
.notebox{margin-top:10px;font-size:12.5px;color:var(--text2);border-left:2px solid var(--border2);padding-left:10px;}

.lec-head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--border2);}
.lec-head h2{font-family:'LemonMilk',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);}
.lec-head p{font-size:12.5px;color:var(--text2);margin-top:2px;}
.key-card-btn{grid-column:1/-1;text-align:left;background:#fdf6e7;border:1px solid #f0dcae;border-radius:14px;padding:16px 18px;cursor:pointer;font-family:inherit;color:var(--text);transition:transform .15s,box-shadow .15s;}
.key-card-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(180,83,9,.12);}
.key-card-btn .kb-t{font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b45309;}
.key-card-btn .kb-n{font-size:15px;font-weight:600;margin-top:4px;}
.key-card-btn .kb-s{font-size:12.5px;color:var(--text2);margin-top:2px;}
#qs-key{margin-top:12px;font-size:13.5px;color:#7c4a03;background:#fdf6e7;border:1px solid #f0dcae;border-left:3px solid #b45309;border-radius:8px;padding:10px 14px;}
#qs-key b{color:#b45309;}
#qs-key a{color:#b45309;cursor:pointer;text-decoration:underline;margin-left:6px;}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:14px;}
.kcard .kc-n{font-family:'LemonMilk',sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
.kcard h3{font-size:17px;margin:2px 0 6px;}
.kcard .kc-idea{font-size:14.5px;margin-bottom:10px;}
.kcard .kc-lbl{font-family:'LemonMilk',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#0f766e;margin:10px 0 4px;}
.kcard ul{list-style:none;}
.kcard li{font-size:14px;padding:3px 0 3px 16px;position:relative;}
.kcard li::before{content:'';position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:#0f766e;}
.kcard .kc-f li{font-family:'DM Sans',sans-serif;background:#f0f7f6;border-radius:6px;margin:4px 0;padding:6px 10px 6px 22px;}
.kcard .kc-f li::before{left:9px;top:15px;}
.kcard .kc-trap{margin-top:12px;font-size:13.5px;background:var(--wrong-bg);border:1px solid var(--wrong-border);color:#8a2a1f;border-radius:8px;padding:8px 12px;}
.kcard .kc-go{margin-top:12px;font-size:12px;color:var(--text2);}
.key-foot{margin-top:20px;}
#key-go{background:var(--pill-active-bg);color:var(--pill-active-text);border:none;border-radius:8px;padding:10px 18px;font-family:'LemonMilk',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
</style>
</head>
<body>
<div id="shell">
  <div id="topnav">
    <div class="brand">PADIPUCAST <span>&#183;</span> Wave Optics &#183; Lecture DPP</div>
    <button id="back-btn" onclick="goHome()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      All Sets
    </button>
  </div>

  <div id="home-screen" class="screen active">
    <div id="home-heading"><h1>Wave Optics &#183; Lecture DPP</h1></div>
    <div class="home-actions">
      <div class="progress-summary" id="home-progress">Loading...</div>
      <button id="clear-all-btn" onclick="confirmClear()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear All Progress
      </button>
    </div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>

  <div id="key-screen" class="screen">
    <div id="qscreen-header">
      <div class="qs-topic" id="key-topic"></div>
      <div class="qs-title" id="key-title"></div>
    </div>
    <div id="key-list"></div>
    <div class="key-foot"><button id="key-go" onclick="goHome()">Back to the ladders</button></div>
  </div>

  <div id="q-screen" class="screen">
    <div id="qscreen-header">
      <div class="qs-topic" id="qs-topic-label"></div>
      <div class="qs-title" id="qs-title"></div>
      <div id="qs-key"></div>
    </div>
    <div class="score-strip">
      <div class="score-chip">Score <span id="sc-score">0</span> / <span id="sc-total">5</span></div>
      <div class="score-chip">Attempted <span id="sc-att">0</span></div>
    </div>
    <div class="q-selector" id="q-selector"></div>
    <div id="q-card">
      <div class="q-label" id="q-label">Rung 1 of 4</div>
      <div class="q-text" id="q-text"></div>
      <div class="q-diagram" id="q-diagram" style="display:none"></div>
      <div class="options" id="options"></div>
      <div id="sol-wrap"><div id="sol-box"></div></div>
      <div class="act-row">
        <div style="display:flex;align-items:center;gap:10px;">
          <div id="feedback"></div>
          <button id="show-ans-btn" onclick="showAnswer()">Show Answer</button>
        </div>
        <div class="nav-btns">
          <button id="prev-btn" onclick="moveQ(-1)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
            Prev
          </button>
          <button id="next-btn" onclick="moveQ(1)">
            Next
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

const STORAGE_KEY = 'padipucast_waveoptics_lecture_dpp_l1l2_v1';

function loadAnswers(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length === TOPICS.length) return parsed;
    }
  }catch(e){}
  return TOPICS.map(t=>Array(t.questions.length).fill(null));
}
function saveAnswers(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); }catch(e){} }

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

const TOPICS_SHUFFLED = TOPICS.map((t,ti)=>({
  ...t, topicIdx:ti,
  questions:t.questions.map((raw)=>{
    const indexed = raw.opts.map((o,i)=>({text:o, isCorrect:i===raw.ans}));
    shuffle(indexed);
    return{q:raw.q, diagram:raw.diagram||null, opts:indexed.map(o=>o.text), ans:indexed.findIndex(o=>o.isCorrect), sol:raw.sol, tag:raw.tag||'', note:raw.note||'', yt:raw.yt||'', starLbl:raw.starLbl||''};
  })
}));

      const cs=Object.keys(KEYS).filter(k=>KEYS[k].lec===topic.lec);
      const h=document.createElement('div'); h.className='lec-head';
      h.innerHTML=`<div><h2>Lecture ${topic.lec} &#183; Wave Optics ${topic.lec===1?'I':'II'}</h2><p>${cs.length} concepts &#183; ${nl} ladders</p></div>`;
      topicGrid.appendChild(h);
      const kb=document.createElement('button'); kb.className='key-card-btn';
      kb.innerHTML=`<div class="kb-t">&#9733; Start here &#183; Key ideas</div><div class="kb-n">Lecture ${topic.lec} key ideas &#8212; ${cs.length} concept cards</div><div class="kb-s">${cs.map(k=>KEYS[k].title).join(' &#183; ')}</div>`;
      kb.onclick=()=>openKeys(topic.lec);
      topicGrid.appendChild(kb);
    }
    const ans=answers[ti]; const n=topic.questions.length;
    const done=ans.filter(a=>a!==null&&a.correct).length;
    const att=ans.filter(a=>a!==null).length;
    totalCorrect+=done;
    const card=document.createElement('button');
    card.className='topic-card'+(att===n&&done===n?' all-done':'');
    const dots=Array(n).fill(0).map((_,i)=>{
      const d=answers[ti][i];
      return `<span class="tc-dot${d===null?'':d.correct?' done':' wrong'}"></span>`;
    }).join('');
    card.innerHTML=`<div class="tc-num">Ladder ${String(ti+1).padStart(2,'0')}${topic.part?' &#183; '+topic.part:''} <span class="modepill ${topic.mode==='class'?'mp-class':'mp-hw'}">${topic.mode==='class'?'Discuss in class':'Homework'}</span></div>
      <div class="tc-name">${topic.name}</div>
      <div class="tc-bar"><div class="tc-dots">${dots}</div><span class="tc-count">${att}/${n} climbed</span></div>
      <svg class="tc-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    card.onclick=()=>openTopic(ti);
    topicGrid.appendChild(card);
  });
  homeProgress.innerHTML=`<span>${totalCorrect}</span> / ${totalQuestions()} correct`;
}


const keyScreen=document.getElementById('key-screen');
function openKeys(lec,focus){
  homeScreen.classList.remove('active'); qScreen.classList.remove('active'); keyScreen.classList.add('active');
  backBtn.style.display='flex'; hideYT();
  const cs=Object.keys(KEYS).filter(k=>KEYS[k].lec===lec);
  document.getElementById('key-topic').innerHTML=`Lecture ${lec} &#183; key ideas`;
  document.getElementById('key-title').innerHTML=`Wave Optics ${lec===1?'I':'II'} &#8212; read these before the ladders`;
  document.getElementById('key-list').innerHTML=cs.map((k,i)=>{const c=KEYS[k];
    const lad=TOPICS.map((t,ti)=>({t,ti})).filter(x=>x.t.c===k).map(x=>'L'+String(x.ti+1).padStart(2,'0')).join(', ');
    return `<div class="kcard" id="kc-${k}"><div class="kc-n">Concept ${i+1} of ${cs.length}</div><h3>${c.title}</h3>
    <div class="kc-idea">${c.idea}</div>
    <div class="kc-lbl">Formulas</div><ul class="kc-f">${c.f.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="kc-lbl">What is what</div><ul>${c.what.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="kc-trap"><b>Watch out:</b> ${c.trap}</div>
    <div class="kc-go">Ladders for this concept: ${lad}</div></div>`;}).join('');
  if(focus){const el=document.getElementById('kc-'+focus); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50);} else window.scrollTo(0,0);
}

function openTopic(ti){
  curTopic=TOPICS_SHUFFLED[ti]; curQ=0;
  homeScreen.classList.remove('active'); keyScreen.classList.remove('active');
  qScreen.classList.add('active');
  backBtn.style.display='flex';
  const first=answers[ti].findIndex(a=>a===null);
  if(first!==-1) curQ=first;
  renderQScreen();
}

function goHome(){
  qScreen.classList.remove('active'); keyScreen.classList.remove('active');
  homeScreen.classList.add('active');
  backBtn.style.display='none';
  hideYT(); buildHome();
}

function renderQScreen(){
  const ti=TOPICS_SHUFFLED.indexOf(curTopic);
  const n=curTopic.questions.length;
  qsTopicLbl.innerHTML=`Ladder ${String(ti+1).padStart(2,'0')}${curTopic.part?' &#183; '+curTopic.part:''} <span class="modepill ${curTopic.mode==='class'?'mp-class':'mp-hw'}">${curTopic.mode==='class'?'Discuss in class':'Homework'}</span>`;
  qsTitle.innerHTML=curTopic.name;
  document.getElementById('qs-key').innerHTML=`<b>Key idea.</b> ${curTopic.keyIdea} <a onclick="openKeys(${curTopic.lec},'${curTopic.c}')">Open key ideas</a>`;
  const topicAns=answers[ti];
  scScore.textContent=topicAns.filter(a=>a&&a.correct).length;
  scTotal.textContent=n;
  scAtt.textContent=topicAns.filter(a=>a!==null).length;
  qSelector.innerHTML='';
  curTopic.questions.forEach((_,i)=>{
    const a=answers[ti][i];
    const pill=document.createElement('button');
    pill.className='q-pill'+(i===curQ?' active':'')+(a?a.correct?' answered-c':' answered-w':'');
    pill.innerHTML=(i===n-1)?'&#9733;':(i+1);
    pill.onclick=()=>{curQ=i;renderQScreen();};
    qSelector.appendChild(pill);
  });
  renderQuestion();
  updateYTVisibility();
}

function renderQuestion(){
  const ti=TOPICS_SHUFFLED.indexOf(curTopic);
  const n=curTopic.questions.length;
  const q=curTopic.questions[curQ];
  const a=answers[ti][curQ];
  qLabel.innerHTML=(curQ===n-1)
    ? `Rung ${n} of ${n} &#183; <span class="orig">&#9733; ${q.starLbl||'Original question'}</span>`+(q.tag?`<span class="srctag">${q.tag}</span>`:'')
    : `Rung ${curQ+1} of ${n} &#183; Build-up`+(q.tag?`<span class="srctag">${q.tag}</span>`:'');
  qText.innerHTML=q.q+(q.note?`<div class="notebox">${q.note}</div>`:'');
  if(q.diagram){
    qDiagram.style.display='flex';
    qDiagram.innerHTML=q.diagram;
  } else { qDiagram.style.display='none'; qDiagram.innerHTML=''; }
  solWrap.classList.remove('open');
  solBox.innerHTML='';
  feedbackEl.className=''; feedbackEl.textContent='';
  const card=document.getElementById('q-card');
  card.style.animation='none'; card.offsetHeight; card.style.animation='';
  optionsDiv.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt'+(a?' locked':'');
    btn.innerHTML=`<span class="opt-letter">${['A','B','C','D','E'][i]}</span><span>${opt}</span>`;
    if(a!==null){
      if(i===q.ans) btn.classList.add('is-correct');
      else if(i===a.chosen&&!a.correct) btn.classList.add('is-wrong');
      else btn.classList.add('reveal-correct');
    } else { btn.onclick=()=>choose(i); }
    optionsDiv.appendChild(btn);
  });
  if(a!==null){
    solBox.innerHTML=`<strong>Solution &#8212;</strong> ${q.sol}`;
    solWrap.classList.add('open');
    showFeedback(a.correct);
    showAnsBtn.style.display='none';
  } else { showAnsBtn.style.display='inline-block'; }
  prevBtn.disabled=curQ===0;
  nextBtn.disabled=false;
  if(curQ===n-1){
    nextBtn.innerHTML=`Done <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  } else {
    nextBtn.innerHTML=`Next <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></svg>`;
  }
  updateYTVisibility();
}

function choose(chosen){
  const ti=TOPICS_SHUFFLED.indexOf(curTopic);
  const q=curTopic.questions[curQ];
  const correct=chosen===q.ans;
  answers[ti][curQ]={chosen,correct};
  saveAnswers();
  const opts=optionsDiv.querySelectorAll('.opt');
  opts.forEach((btn,i)=>{
    btn.classList.add('locked'); btn.onclick=null;
    if(i===q.ans) btn.classList.add('is-correct');
    else if(i===chosen&&!correct) btn.classList.add('is-wrong');
    else btn.classList.add('reveal-correct');
  });
  solBox.innerHTML=`<strong>Solution &#8212;</strong> ${q.sol}`;
  solWrap.classList.add('open');
  showFeedback(correct);
  showAnsBtn.style.display='none';
  const pills=qSelector.querySelectorAll('.q-pill');
  pills[curQ].classList.remove('active');
  pills[curQ].classList.add(correct?'answered-c':'answered-w');
  pills[curQ].classList.add('active');
  const topicAns=answers[ti];
  scScore.textContent=topicAns.filter(a=>a&&a.correct).length;
  scAtt.textContent=topicAns.filter(a=>a!==null).length;
}

function showFeedback(correct){
  feedbackEl.className=''; feedbackEl.offsetHeight;
  feedbackEl.textContent=correct?'Correct \u2713':'Incorrect \u2717';
  feedbackEl.className=(correct?'fb-c':'fb-w')+' show';
}

function showAnswer(){
  const ti=TOPICS_SHUFFLED.indexOf(curTopic);
  const q=curTopic.questions[curQ];
  answers[ti][curQ]={chosen:-1,correct:false};
  saveAnswers();
  const opts=optionsDiv.querySelectorAll('.opt');
  opts.forEach((btn,i)=>{
    btn.classList.add('locked'); btn.onclick=null;
    if(i===q.ans) btn.classList.add('is-correct');
    else btn.classList.add('reveal-correct');
  });
  solBox.innerHTML=`<strong>Solution &#8212;</strong> ${q.sol}`;
  solWrap.classList.add('open');
  feedbackEl.className='fb-w show';
  feedbackEl.textContent='Answer shown';
  showAnsBtn.style.display='none';
  const pills=qSelector.querySelectorAll('.q-pill');
  pills[curQ].classList.add('answered-w');
  scAtt.textContent=answers[ti].filter(a=>a!==null).length;
}

function moveQ(dir){
  const n=curTopic.questions.length;
  const newQ=curQ+dir;
  if(newQ<0) return;
  if(newQ>n-1){ goHome(); return; }
  curQ=newQ; renderQScreen();
}

function confirmClear(){ clearModal.classList.add('show'); }
function cancelClear(){ clearModal.classList.remove('show'); }
function executeClear(){
  answers=TOPICS.map(t=>Array(t.questions.length).fill(null));
  saveAnswers();
  clearModal.classList.remove('show');
  buildHome();
  showToast('All progress cleared');
}
function showToast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2400);
}

function updateYTVisibility(){
  if(qScreen.classList.contains('active')){ ytTrigger.classList.add('visible'); }
  else { ytTrigger.classList.remove('visible'); hideYT(); }
}
ytTrigger.onclick=()=>{ ytCorner.classList.add('visible'); ytTrigger.classList.remove('visible'); };
function closeYT(){
  ytCorner.classList.remove('visible');
  if(qScreen.classList.contains('active')) ytTrigger.classList.add('visible');
  ytEmbed.style.display='none'; ytEmbed.innerHTML=''; ytInput.value='';
}
function hideYT(){
  ytCorner.classList.remove('visible'); ytTrigger.classList.remove('visible');
  ytEmbed.style.display='none'; ytEmbed.innerHTML=''; ytInput.value='';
}
function parseYTTime(s){
  if(!s)return 0; if(/^\d+$/.test(s))return parseInt(s);
  let t=0;
  const h=s.match(/(\d+)h/);if(h)t+=parseInt(h[1])*3600;
  const m=s.match(/(\d+)m/);if(m)t+=parseInt(m[1])*60;
  const sc=s.match(/(\d+)s/);if(sc)t+=parseInt(sc[1]);
  return t;
}
function extractYTData(url){
  if(!url)return null;
  let id='',start=0;
  const idM=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  if(idM)id=idM[1];else{const bM=url.match(/^([a-zA-Z0-9_-]{11})$/);if(bM)id=bM[1];}
  if(!id)return null;
  const tM=url.match(/[?&]t=([^&\s]+)/);if(tM)start=parseYTTime(tM[1]);
  return{id,start};
}
function loadYT(){
  const val=ytInput.value.trim();if(!val)return;
  const ytd=extractYTData(val);
  if(!ytd){ytEmbed.style.display='block';ytEmbed.innerHTML=`<p style="font-size:12px;color:var(--wrong);padding:6px 0;">Couldn't find a valid YouTube URL.</p>`;return;}
  const embedUrl='https://www.youtube.com/embed/'+ytd.id+'?autoplay=0&rel=0'+(ytd.start?'&start='+ytd.start:'');
  ytEmbed.style.display='block';
  ytEmbed.innerHTML=`<iframe src="${embedUrl}" allowfullscreen></iframe>`;
}
ytInput.addEventListener('keydown',e=>{if(e.key==='Enter')loadYT();});
clearModal.addEventListener('click',e=>{if(e.target===clearModal)cancelClear();});

buildHome();
</script>
</body>
</html>
